name: funding-arb CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the repository. Fork pull requests receive no write-capable token.
permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install hash-locked paper dependencies
        # The paper profile includes the full existing Python test suite and
        # deliberately excludes optional DEX SDKs; do not narrow collection to
        # make a missing optional SDK look like a passing test.
        run: python -m pip install --require-hashes -r requirements.paper.lock
      - name: Run full Python suite (paper Binance/Bybit profile)
        run: python -m pytest scripts/tests/ -q

  docs-sync:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - run: bash scripts/tools/check_docs_sync.sh

  frontend-security:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Run static security contracts
        run: node --test web/tests/security-contract.test.mjs
      # npm lifecycle scripts execute only in a disposable hosted runner with
      # no secrets and a read-only GitHub token.
      - name: Install frontend from the committed lockfile
        run: npm ci --prefix web
      - name: Type-check and build frontend
        run: npm run build --prefix web
